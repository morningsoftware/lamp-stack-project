info:
  name: Create skill (admin)
  type: http
  seq: 52

http:
  method: POST
  url: "{{urlBase}}/api/index.php/skills"
  body:
    type: json
    json: |
      {
        "name": "Rust",
        "category": "language"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 201
