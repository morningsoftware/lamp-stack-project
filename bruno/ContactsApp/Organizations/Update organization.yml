info:
  name: Update organization
  type: http
  seq: 94

http:
  method: PUT
  url: "{{urlBase}}/api/index.php/organizations/{{process.env.TEST_ORG_SLUG}}"
  body:
    type: json
    json: |
      {
        "name": "Morning Software",
        "description": "A small software collective (updated)",
        "location": "Remote",
        "website": "https://example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
