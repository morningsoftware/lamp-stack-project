info:
  name: Decline invitation
  type: http
  seq: 100

http:
  method: POST
  url: "{{urlBase}}/api/index.php/organizations/invitations/{{process.env.TEST_INVITATION_ID}}/decline"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
