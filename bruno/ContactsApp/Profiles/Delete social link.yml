info:
  name: Delete social link
  type: http
  seq: 30

http:
  method: DELETE
  url: "{{urlBase}}/api/index.php/profiles/{{process.env.TEST_USERID}}/social_links/{{process.env.TEST_LINK_ID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
