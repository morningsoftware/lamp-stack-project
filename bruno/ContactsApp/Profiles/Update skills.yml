info:
  name: Update skills
  type: http
  seq: 27

http:
  method: PUT
  url: "{{urlBase}}/api/index.php/profiles/{{process.env.TEST_USERID}}/skills"
  body:
    type: json
    json: |
      {
        "skills": [
          { "skillid": 1, "proficiency": "advanced" },
          { "name": "TypeScript", "proficiency": "intermediate" }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
