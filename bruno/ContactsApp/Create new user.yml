info:
  name: Create new user
  type: http
  seq: 2

http:
  method: POST
  url: "{{urlBase}}/api/index.php/auth/register"
  body:
    type: multipart-form
    data:
      - name: login
        type: text
        value: "{{process.env.NEW_LOGIN}}"
      - name: email
        type: text
        value: "{{process.env.NEW_EMAIL}}"
      - name: password
        type: text
        value: "{{process.env.NEW_PASSWORD}}"
      - name: githubUsername
        type: text
        value: "{{process.env.NEW_GITHUB}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
