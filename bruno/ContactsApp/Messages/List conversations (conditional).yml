info:
  name: List conversations (conditional)
  type: http
  seq: 72

http:
  method: GET
  url: "{{urlBase}}/api/index.php/conversations"
  headers:
    - name: If-None-Match
      value: "{{process.env.TEST_CONVO_ETAG}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 304
