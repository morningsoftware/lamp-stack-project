info:
  name: Send message
  type: http
  seq: 75

http:
  method: POST
  url: "{{urlBase}}/api/index.php/conversations/{{process.env.TEST_CONVERSATION_ID}}/messages"
  body:
    type: json
    json: |
      {
        "body": "hello from bruno"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 201
