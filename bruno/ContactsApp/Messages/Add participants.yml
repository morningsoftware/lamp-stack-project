info:
  name: Add participants
  type: http
  seq: 80

http:
  method: POST
  url: "{{urlBase}}/api/index.php/conversations/{{process.env.TEST_CONVERSATION_ID}}/participants"
  body:
    type: json
    json: |
      {
        "userIds": [{{process.env.TEST_USERID2}}]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
