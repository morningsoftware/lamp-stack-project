info:
  name: List messages (since)
  type: http
  seq: 77

http:
  method: GET
  url: "{{urlBase}}/api/index.php/conversations/{{process.env.TEST_CONVERSATION_ID}}/messages?since={{process.env.TEST_SINCE_MESSAGE_ID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
