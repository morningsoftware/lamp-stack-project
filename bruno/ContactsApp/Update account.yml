info:
  name: Update account
  type: http
  seq: 7

http:
  method: PUT
  url: "{{urlBase}}/api/index.php/auth/account"
  body:
    type: json
    json: |
      {
        "currentPassword": "{{process.env.TEST_PASSWORD}}",
        "email": "{{process.env.TEST_EMAIL}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
