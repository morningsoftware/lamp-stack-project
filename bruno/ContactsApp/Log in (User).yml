info:
  name: Log in (User)
  type: http
  seq: 3

http:
  method: POST
  url: "{{urlBase}}/api/index.php/auth/login"
  body:
    type: multipart-form
    data:
      - name: login
        type: text
        value: "{{process.env.TEST_LOGIN}}"
      - name: password
        type: text
        value: "{{process.env.TEST_PASSWORD}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
