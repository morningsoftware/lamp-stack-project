info:
  name: Set password
  type: http
  seq: 135

http:
  method: PUT
  url: "{{urlBase}}/api/index.php/admin/users/{{process.env.TEST_USERID}}/password"
  body:
    type: json
    json: |
      {
        "newPassword": "{{process.env.NEW_PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
