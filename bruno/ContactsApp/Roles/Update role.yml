info:
  name: Update role
  type: http
  seq: 114

http:
  method: PUT
  url: "{{urlBase}}/api/index.php/roles/{{process.env.TEST_ROLE_ID}}"
  body:
    type: json
    json: |
      {
        "name": "Backend Engineer (updated)",
        "description": "PHP, MySQL, and APIs",
        "status": "open"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
