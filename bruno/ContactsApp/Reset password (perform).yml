info:
  name: Reset password (perform)
  type: http
  seq: 9

http:
  method: POST
  url: "{{urlBase}}/api/index.php/auth/reset"
  body:
    type: json
    json: |
      {
        "token": "{{process.env.TEST_RESET_TOKEN}}",
        "newPassword": "{{process.env.NEW_PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 200
