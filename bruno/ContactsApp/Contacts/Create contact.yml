info:
  name: Create contact
  type: http
  seq: 43

http:
  method: POST
  url: "{{urlBase}}/api/index.php/contacts"
  body:
    type: json
    json: |
      {
        "firstName": "Grace",
        "lastName": "Hopper",
        "email": "grace@example.com",
        "phone": "5550100",
        "description": "compiler pioneer"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

assert:
  - res.status: eq 201
